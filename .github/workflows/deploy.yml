name: Deploy

# Pushes to main go to staging. Production only goes out by hand (Run workflow)
# or when a version tag like v1.0.0 is pushed.
#
# Secrets to add in GitHub (Settings > Secrets and variables > Actions), per environment:
#   SSH_PRIVATE_KEY  a deploy key that can log in to the host
#   SSH_KNOWN_HOSTS  the output of: ssh-keyscan -p <port> <host>
#   SSH_HOST         the server name
#   SSH_USER         the login user
#   SSH_PORT         usually 22
#   WP_PATH          the WordPress folder on the server, for example /var/www/html
# Make two GitHub environments, "staging" and "production", each with its own values.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find plugins themes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON check
        run: for f in plugins/wee-time-core/data/*.json themes/wee-time/theme.json; do python3 -m json.tool "$f" > /dev/null; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy theme and site plugin
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}
          DEST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}
        run: |
          rsync -az --delete -e "$SSH" themes/wee-time/ "$DEST/wp-content/themes/wee-time/"
          rsync -az --delete -e "$SSH" plugins/wee-time-core/ "$DEST/wp-content/plugins/wee-time-core/"
      - name: Refresh links and clear caches
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd '${{ secrets.WP_PATH }}' && (command -v wp >/dev/null && wp rewrite flush && wp cache flush || echo 'WP-CLI not on the server: open Settings > Permalinks once and press Save')"
